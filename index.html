<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eef2f3" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%231d2224'/><circle cx='16' cy='16' r='7' fill='none' stroke='%232f7d54' stroke-width='2.5'/></svg>" />
    <title><!-- figma:title --></title>
    <meta name="description" content="A private, minimalist search engine designed for clarity and calm discovery." />
    <link rel="canonical" href="https://voidcore.me/" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('void_theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root">
      <main style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui,-apple-system,sans-serif;text-align:center;padding:2rem;">
        <h1 style="font-size:2.5rem;font-weight:300;letter-spacing:0.1em;margin:0 0 0.5rem 0;color:#0f172a;">VOID</h1>
        <p style="font-size:0.85rem;letter-spacing:0.25em;text-transform:uppercase;color:#64748b;margin:0 0 2rem 0;font-weight:500;">A QUIETER WAY TO SEARCH</p>
        <p style="font-size:0.95rem;color:#475569;max-width:480px;margin:0;line-height:1.5;">A private, minimalist search engine designed for clarity and calm discovery.</p>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
